<!DOCTYPE html>
<html lang="th">
<!-- Purple Gradient Header Section -->
<header class="bg-gradient-to-r from-purple-700 via-indigo-600 to-purple-600 text-white p-5 rounded-b-[32px] shadow-md relative z-10 space-y-3">
  
  <!-- Top Badges & Install Button -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-1.5">
      <span class="bg-white/20 backdrop-blur-md text-white text-[10px] px-2.5 py-0.5 rounded-full font-medium">PWA App Ready</span>
      <span class="bg-emerald-500/30 backdrop-blur-md text-emerald-200 text-[10px] px-2.5 py-0.5 rounded-full font-medium border border-emerald-400/20">ติดตั้งบนเครื่องได้</span>
    </div>

    <button id="install-app-btn" class="bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-900 font-bold text-xs px-3.5 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 transition-all">
      <i data-lucide="download" class="w-4 h-4"></i>
      <span>ติดตั้งแอป</span>
    </button>
  </div>

  <!-- Title -->
  <h1 class="text-2xl font-bold tracking-tight">ตารางเรียน & เช็คชื่อ</h1>

  <!-- Current/Next Class Alert Box -->
  <div id="current-class-banner" class="bg-white/15 backdrop-blur-md rounded-2xl p-3 border border-white/20 flex items-center justify-between">
    <div class="flex items-center gap-2.5">
      <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
      <div class="text-xs">
        <p id="banner-sub-code" class="text-purple-200 font-medium">วิชาเรียนวันนี้: CS101</p>
        <p id="banner-sub-name" class="font-semibold text-white truncate max-w-[210px]">การเขียนโปรแกรมคอมพิวเตอร์ 1 (Lab Com 302)</p>
      </div>
    </div>
    <span id="banner-sub-time" class="text-xs font-bold bg-white/20 text-white px-2.5 py-1 rounded-xl">09:00 น.</span>
  </div>
</header>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 md:p-4 font-sans">

  <!-- Mobile Simulator Container -->
  <div class="w-full max-w-md bg-slate-50 min-h-screen md:min-h-[840px] md:h-[840px] md:rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border-0 md:border-8 border-slate-900">
    
    <!-- Purple Gradient Header Section -->
    <header class="bg-gradient-to-r from-purple-700 via-indigo-600 to-purple-600 text-white p-5 rounded-b-[32px] shadow-md relative z-10 space-y-3">
      
      <!-- Top Badges & Install Button -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="bg-white/20 backdrop-blur-md text-white text-[10px] px-2.5 py-0.5 rounded-full font-medium">PWA App Ready</span>
          <span class="bg-emerald-500/30 backdrop-blur-md text-emerald-200 text-[10px] px-2.5 py-0.5 rounded-full font-medium border border-emerald-400/20">ติดตั้งบนเครื่องได้</span>
        </div>

        <button id="install-app-btn" class="bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-900 font-bold text-xs px-3.5 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 transition-all">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>ติดตั้งแอป</span>
        </button>
      </div>

      <!-- Title -->
      <h1 class="text-2xl font-bold tracking-tight">ตารางเรียน & เช็คชื่อ</h1>

      <!-- Current/Next Class Alert Box -->
      <div id="current-class-banner" class="bg-white/15 backdrop-blur-md rounded-2xl p-3 border border-white/20 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
          <div class="text-xs">
            <p id="banner-sub-code" class="text-purple-200 font-medium">วิชาเรียนวันนี้: --</p>
            <p id="banner-sub-name" class="font-semibold text-white truncate max-w-[210px]">กำลังโหลดข้อมูล...</p>
          </div>
        </div>
        <span id="banner-sub-time" class="text-xs font-bold bg-white/20 text-white px-2.5 py-1 rounded-xl">--:-- น.</span>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main class="flex-1 overflow-y-auto pb-24 p-4 space-y-4">
      
      <!-- Day Selector Strip -->
      <section class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100">
        <div class="flex justify-between items-center mb-2 px-1">
          <span class="text-xs font-semibold text-slate-400">เลือกวันเรียน</span>
          <button id="today-btn" class="text-[11px] bg-purple-50 hover:bg-purple-100 text-purple-600 font-bold px-2.5 py-0.5 rounded-md transition">วันนี้</button>
        </div>
        <div id="calendar-strip-container"></div>
      </section>

      <!-- Subject List Header -->
      <div class="flex items-center justify-between px-1">
        <div class="flex items-center gap-1.5 text-purple-800 font-bold text-base">
          <i data-lucide="book-open" class="w-5 h-5 text-purple-600"></i>
          <span id="day-title-text">รายการวิชาเรียน</span>
        </div>
        <span id="subject-count-badge" class="bg-slate-200 text-slate-600 text-xs px-2.5 py-0.5 rounded-full font-bold">0 วิชา</span>
      </div>

      <!-- Subject Cards List -->
      <section id="class-cards-container" class="space-y-3"></section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-100 px-6 py-2 flex justify-between items-center z-20">
      <button id="nav-schedule-btn" class="flex flex-col items-center gap-1 text-purple-600 font-bold text-xs">
        <i data-lucide="calendar" class="w-5 h-5"></i>
        <span>ตารางเรียน</span>
      </button>
      
      <button id="nav-stats-btn" class="flex flex-col items-center gap-1 text-slate-400 hover:text-purple-600 font-medium text-xs transition">
        <i data-lucide="pie-chart" class="w-5 h-5"></i>
        <span>สถิติการเข้าเรียน</span>
      </button>

      <button id="nav-add-btn" class="flex flex-col items-center gap-1 text-slate-400 hover:text-purple-600 font-medium text-xs transition">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span>เพิ่มวิชา</span>
      </button>
    </nav>

    <!-- Modal Container -->
    <div id="modal-container"></div>
  </div>

  <!-- Entry Script -->
  <script type="module">
    import { initStorage, getSubjects } from './src/utils/storage.js';
    import { renderCalendarStrip } from './src/components/CalendarStrip.js';
    import { renderClassCards } from './src/components/ClassCard.js';
    import { openAddSubjectModal } from './src/components/AddSubjectModal.js';
    import { openStatsModal } from './src/components/StatsDashboard.js';

    let selectedDayIndex = new Date().getDay();
    const dayNamesFull = ['วันอาทิตย์', 'วันจันทร์', 'วันอังคาร', 'วันพุธ', 'วันพฤหัสบดี', 'วันศุกร์', 'วันเสาร์'];

    function updateBanner() {
      const subjects = getSubjects().filter(s => s.dayOfWeek === selectedDayIndex);
      const bannerName = document.getElementById('banner-sub-name');
      const bannerCode = document.getElementById('banner-sub-code');
      const bannerTime = document.getElementById('banner-sub-time');

      if (subjects.length > 0) {
        const sub = subjects[0];
        bannerCode.textContent = `วิชาเรียนวันนี้: ${sub.code}`;
        bannerName.textContent = `${sub.name} (${sub.room})`;
        bannerTime.textContent = `${sub.startTime} น.`;
      } else {
        bannerCode.textContent = `ไม่มีเรียนวันนี้`;
        bannerName.textContent = `พักผ่อนให้เต็มที่!`;
        bannerTime.textContent = `--:--`;
      }
    }

    function refreshView() {
      document.getElementById('day-title-text').textContent = `รายการวิชาเรียน ( ${dayNamesFull[selectedDayIndex]} )`;
      const subjects = getSubjects().filter(s => s.dayOfWeek === selectedDayIndex);
      document.getElementById('subject-count-badge').textContent = `${subjects.length} วิชา`;
      
      renderClassCards('class-cards-container', selectedDayIndex, () => refreshView());
      updateBanner();
      lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initStorage();

      renderCalendarStrip('calendar-strip-container', selectedDayIndex, (newDayIndex) => {
        selectedDayIndex = newDayIndex;
        refreshView();
      });

      refreshView();

      document.getElementById('today-btn').addEventListener('click', () => {
        selectedDayIndex = new Date().getDay();
        renderCalendarStrip('calendar-strip-container', selectedDayIndex, (idx) => {
          selectedDayIndex = idx;
          refreshView();
        });
        refreshView();
      });

      document.getElementById('nav-add-btn').addEventListener('click', () => {
        openAddSubjectModal('modal-container', () => refreshView());
      });

      document.getElementById('nav-stats-btn').addEventListener('click', () => {
        openStatsModal('modal-container', () => refreshView());
      });

      window.addEventListener('attendance-updated', refreshView);
    });

    // PWA Install Prompt
    let deferredPrompt;
    const installBtn = document.getElementById('install-app-btn');

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    installBtn.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        if (outcome === 'accepted') console.log('ติดตั้งสำเร็จ');
        deferredPrompt = null;
      } else {
        alert('วิธีติดตั้งลงมือถือ:\n1. เปิด https://notificationclass.vercel.app ในมือถือ\n2. iPhone (Safari): กดแชร์ ➔ "เพิ่มไปยังหน้าจอโฮม"\n3. Android (Chrome): กดเมนู 3 จุด ➔ "ติดตั้งแอป"');
      }
    });

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
      });
    }
  </script>
</body>
</html>
