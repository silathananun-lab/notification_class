<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตารางเรียน & เช็คชื่อ (PWA Version)</title>

  <!-- PWA Manifest & Meta Tags -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ตารางเรียน">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3652/3652191.png">

  <!-- Font & Tailwind CSS & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 md:p-4 font-sans">

  <!-- Mobile Simulator Container -->
  <div class="w-full max-w-md bg-slate-50 min-h-screen md:min-h-[840px] md:h-[840px] md:rounded-[40px] shadow-2xl overflow-hidden flex flex-col relative border-0 md:border-8 border-slate-900">
    
    <!-- Purple Gradient Header Section -->
    <header class="bg-gradient-to-r from-purple-700 via-indigo-600 to-purple-600 text-white p-5 rounded-b-[32px] shadow-md relative z-10 space-y-3">
      
      <!-- Top Badges & Install Button -->
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-1.5">
          <span class="bg-white/20 backdrop-blur-md text-white text-[10px] px-2.5 py-0.5 rounded-full font-medium">PWA App Ready</span>
          <span class="bg-emerald-500/30 backdrop-blur-md text-emerald-200 text-[10px] px-2.5 py-0.5 rounded-full font-medium border border-emerald-400/20">ติดตั้งบนเครื่องได้</span>
        </div>

        <button id="install-app-btn" class="bg-amber-400 hover:bg-amber-300 active:scale-95 text-slate-900 font-bold text-xs px-3.5 py-1.5 rounded-full shadow-lg flex items-center gap-1.5 transition-all">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>ติดตั้งแอป</span>
        </button>
      </div>

      <!-- Title & Notification Trigger Button -->
      <div class="flex items-center justify-between">
        <h1 class="text-2xl font-bold tracking-tight">ตารางเรียน & เช็คชื่อ</h1>
        <button id="enable-notif-btn" class="bg-white/20 hover:bg-white/30 active:scale-95 text-white text-xs px-3 py-1.5 rounded-xl backdrop-blur-md border border-white/20 flex items-center gap-1.5 transition-all">
          <i data-lucide="bell" class="w-3.5 h-3.5"></i>
          <span>เปิดการแจ้งเตือน</span>
        </button>
      </div>

      <!-- Current/Next Class Alert Box -->
      <div id="current-class-banner" class="bg-white/15 backdrop-blur-md rounded-2xl p-3 border border-white/20 flex items-center justify-between">
        <div class="flex items-center gap-2.5">
          <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
          <div class="text-xs">
            <p id="banner-sub-code" class="text-purple-200 font-medium">วิชาเรียนวันนี้: --</p>
            <p id="banner-sub-name" class="font-semibold text-white truncate max-w-[210px]">กำลังโหลดข้อมูล...</p>
          </div>
        </div>
        <span id="banner-sub-time" class="text-xs font-bold bg-white/20 text-white px-2.5 py-1 rounded-xl">--:-- น.</span>
      </div>
    </header>

    <!-- Main Scrollable Content -->
    <main class="flex-1 overflow-y-auto pb-24 p-4 space-y-4">
      
      <!-- Day Selector Strip -->
      <section class="bg-white rounded-2xl p-3 shadow-sm border border-slate-100">
